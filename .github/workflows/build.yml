# 双平台发布物构建：手动触发或推送 v* 标签时运行。
#
# PyInstaller 不做交叉编译，因此 Linux 与 Windows 各在自己的 runner 上跑仓库
# 自带的构建脚本（含 pytest / ruff / mypy 质量门与打包烟雾测试）。Linux 产物
# 动态链接构建机的 glibc：ubuntu-24.04 runner 为 glibc 2.39，产物可在
# glibc >= 2.39 的 x86_64 发行版上启动，比本地 2.43 基线兼容面更大。
# runner 无显示会话，build.sh 会跳过真实平台插件的第二次烟雾并告警，属预期。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装系统依赖（中文字体与 Qt 离屏运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk libegl1 libopengl0 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: 准备虚拟环境
        # 先用 setup-python 的解释器建好 .venv，bootstrap 检测到已存在就不再自选解释器。
        run: |
          python -m venv .venv
          ./scripts/bootstrap.sh
      - name: 构建并验证
        run: ./scripts/build.sh
      - name: 打包产物（tar 保留可执行位）
        run: tar -C dist -czf "RouteAnalysis-${{ github.ref_name }}-linux-x64.tar.gz" RouteAnalysis
      - uses: actions/upload-artifact@v4
        with:
          name: RouteAnalysis-linux-x64
          path: RouteAnalysis-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 准备虚拟环境
        shell: pwsh
        run: |
          python -m venv .venv
          & scripts\bootstrap.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建并验证
        shell: pwsh
        run: |
          & scripts\build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包产物
        shell: pwsh
        run: Compress-Archive -Path dist\RouteAnalysis -DestinationPath "RouteAnalysis-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RouteAnalysis-windows-x64
          path: RouteAnalysis-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release（仅标签）
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 创建 Release 并附上两个平台的产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RouteAnalysis $GITHUB_REF_NAME" \
            --generate-notes \
            RouteAnalysis-*-linux-x64.tar.gz RouteAnalysis-*-windows-x64.zip
