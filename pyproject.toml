[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suntae-route-analysis"
version = "0.6.0"
description = "Read-only desktop route and vehicle clearance analysis for Suntae scheduling"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Suntae" }]
dependencies = [
    "numpy>=2.1,<3",
    "PySide6>=6.11,<6.12",
    "requests>=2.34,<2.35",
    "shapely>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.16,<2",
    "pip-audit>=2.10,<3",
    "PyInstaller>=6.22,<7",
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.12,<1",
    "types-requests>=2.32,<3",
]

[project.scripts]
route-analysis = "route_analysis.app:main"

[tool.setuptools.packages.find]
include = ["route_analysis*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true
